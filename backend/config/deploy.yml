service: backend
image: workoutride-app/workoutride-production/backend

servers:
  web:
    - 34.138.232.78

deploy_timeout: 120

proxy:
  host: workoutride.ohnaoki.app
  ssl:
    certificate_pem: CLOUDFLARE_ORIGIN_CERT
    private_key_pem: CLOUDFLARE_ORIGIN_KEY
  healthcheck:
    path: /up
    interval: 5

registry:
  server: us-east1-docker.pkg.dev
  username: oauth2accesstoken
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - BACKEND_DATABASE_PASSWORD
  clear:
    GOOGLE_CLIENT_ID: "432477473655-2ovs5abgvf6cu6ke9gli7b5phgi0je4u.apps.googleusercontent.com"
    # Neon (single DB). Direct endpoint (no -pooler) so Rails prepared statements work.
    DB_HOST: "ep-snowy-butterfly-adeqjr23.c-2.us-east-1.aws.neon.tech"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

volumes:
  - "backend_storage:/rails/storage"

builder:
  arch: amd64

ssh:
  user: ohnaoki
  keys:
    - ~/.ssh/workoutride_deploy
