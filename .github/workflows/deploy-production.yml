name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy (Production)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.1"
          bundler-cache: true
          working-directory: backend

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/workoutride_deploy
          chmod 600 ~/.ssh/workoutride_deploy
          ssh-keyscan 34.138.232.78 >> ~/.ssh/known_hosts

      - name: Deploy with Kamal
        run: bundle exec kamal deploy
